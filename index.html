<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Peg Solitaire 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
 --paper:#fbf9f4;--grid:rgba(96,128,170,.12);--ink:#262222;--sub:#5b524e;--mute:#8a807a;--line:#d8d0c3;
 --acc:#d6336c;--acc-soft:#fde3ec;--teal:#178f86;--teal-soft:#dff3f0;--sun:#ffd65a;--card:#fff;
 --ok:#2f8a5a;--bad:#c2410c;--peg:#7c4ddb;--tgt:#2fbf71;
 --display:'Jua','Noto Sans KR',sans-serif;--body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;word-break:keep-all}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;-webkit-user-select:none;user-select:none}
button{font-family:var(--body);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1.15}
h1 span{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);padding:0 3px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px 10px 20px 12px;padding:18px}
.btn{font-size:16px;font-weight:700;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:11px 14px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.on{background:var(--teal-soft);border-color:var(--teal)}
.btn:disabled{opacity:.4}
input.name{width:100%;font-size:22px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;font-family:var(--body);margin:12px 0;-webkit-user-select:text;user-select:text}
.err{color:var(--bad);font-weight:700;min-height:1.4em;font-size:15px}
/* 위쪽 줄 */
.top{position:sticky;top:0;z-index:20;background:rgba(251,249,244,.95);backdrop-filter:blur(4px);border-bottom:2px solid var(--line);padding:8px 12px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.chip.real{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.prac{background:var(--teal-soft);border-color:var(--teal)}
.who{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.timer{font:400 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.timer.low{color:var(--acc)}
.score{font:400 20px/1 var(--display);color:var(--acc);white-space:nowrap}
/* 대기 */
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.howto div{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;color:var(--sub)}
.howto b{display:block;font-size:24px;margin-bottom:2px}
.big{font-family:var(--display);font-size:26px;text-align:center;margin:8px 0}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.res div{border:2px solid var(--ink);border-radius:12px;padding:10px 4px;background:#fff}
.res b{display:block;font:400 30px/1.1 var(--display);color:var(--acc)}
.res span{font-size:12px;color:var(--sub)}
/* 게임 */
.plist{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.plist .btn{flex:0 0 auto;padding:7px 11px;font-size:14px;border-width:2px}
.plist .btn.done::after{content:" ✓";color:var(--ok)}
.nums{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.num{flex:0 0 auto;min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font:400 18px/1 var(--display);color:var(--ink);cursor:pointer;padding:0 6px}
.num.seen{border-color:#e08a00;background:#fff4e0}
.num.done{border-color:var(--ok);background:#e3f4ea;color:var(--ok)}
.num.done::after{content:"✓";font-size:12px;margin-left:2px}
.num.cur{outline:3px solid var(--ink);outline-offset:1px}
.num.lock{background:#efebe4;border-color:#e2dcd2;color:#b9b0a3;cursor:not-allowed;font-size:13px}
.ptitle2{font-family:var(--display);font-size:21px;text-align:center;margin:2px 0}
.lead{font-size:14px;color:var(--sub);text-align:center;margin:0 0 4px;line-height:1.5}
.msg{text-align:center;font-weight:700;min-height:1.5em;margin:6px 0;font-size:15px;line-height:1.45}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.stage{display:flex;justify-content:center;margin:4px 0 6px}
/* 판 */
.pb{position:relative;touch-action:manipulation}
.pb.sq{background:#efe8dc;border:2.5px solid var(--ink);border-radius:18px}
.pb.tri{background:none}
.tri-bg{position:absolute;inset:0;pointer-events:none}
.hole{position:absolute;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hole .cup{position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle at 50% 38%,#cfc6b8 0,#e9e2d6 55%,#f6f1e8 100%);box-shadow:inset 0 3px 5px rgba(0,0,0,.28)}
.hole .peg{position:absolute;left:50%;top:50%;width:74%;height:74%;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle at 34% 28%,#f1e8ff 0,#b394f5 22%,#7c4ddb 55%,#4b21a8 100%);box-shadow:0 3px 5px rgba(40,10,90,.35);transition:transform .18s ease,opacity .18s ease}
.hole.sel .peg{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--acc),0 4px 8px rgba(0,0,0,.3)}
.hole.tgt .cup{box-shadow:inset 0 3px 5px rgba(0,0,0,.2),0 0 0 4px var(--tgt);animation:tg 1s ease-in-out infinite}
@keyframes tg{50%{box-shadow:inset 0 3px 5px rgba(0,0,0,.2),0 0 0 7px rgba(47,191,113,.45)}}
.hole.hint .peg{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--sun),0 4px 8px rgba(0,0,0,.3)}
.hole.last .peg{box-shadow:0 0 0 3px rgba(255,214,90,.9),0 3px 5px rgba(40,10,90,.35)}
.hole.pick .cup{box-shadow:inset 0 3px 5px rgba(0,0,0,.28),0 0 0 3px var(--acc)}
.hole .no{position:absolute;left:2px;top:0;font-size:11px;font-weight:800;color:var(--mute);pointer-events:none}
.hole .lab{position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;font:italic 700 20px/1 'Times New Roman',serif;color:#8a807a;pointer-events:none}
.hole.has .lab{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.hole .peg.gone{transform:translate(-50%,-50%) scale(.3);opacity:0}
.choosing .hole.has:hover .peg{opacity:.8}
.info{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub);font-weight:700;margin:2px 0 4px}
.info span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px}
.info .sum{border-color:var(--teal);color:var(--teal);font-family:'Times New Roman',serif;font-style:italic;font-size:16px}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ctrl .btn{padding:10px 2px;font-size:14px}
.ctrl .btn.wide{grid-column:1/-1}
.btn.locked{opacity:.55;border-style:dashed}
.hintc{font-size:12px;opacity:.8;display:block;margin-top:1px}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.5}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat2 div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center}
.stat2 b{display:block;font:400 28px/1.1 var(--display);color:var(--acc)}
.stat2 span{font-size:12px;color:var(--sub)}
.sec{font-family:var(--display);font-size:19px;margin:14px 0 2px}
.gal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.gal .it{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);font-weight:700}
/* 내 기록 */
.hist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.hist h3{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 0}
.hc{background:#fff;border:2px solid var(--ink);border-radius:14px 8px 16px 10px;padding:12px 14px}
.hc .ht{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hc .ht b{font-family:var(--display);font-weight:400;font-size:19px}
.hc .ht span{font-size:12px;color:var(--mute);white-space:nowrap}
.hc .hl{font-size:15px;margin-top:4px;line-height:1.6}
.hc .hl em{font-style:normal;font-weight:800;color:var(--acc)}
.hc .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hc .chips span{background:#f3eee6;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
/* 덮개 */
.ov{position:fixed;inset:0;z-index:60;background:rgba(38,34,34,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ov .card{max-width:420px;width:100%;text-align:center}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:70;background:#fff;border:3px solid var(--ok);border-radius:20px;padding:18px 26px;text-align:center;font-family:var(--display);font-size:28px;color:var(--ok);box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.toast small{display:block;font-family:var(--body);font-size:14px;color:var(--sub);margin-top:4px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.net{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#fff3cd;border:2px solid #e0b400;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;z-index:80}
@media (prefers-reduced-motion:reduce){.hole .peg{transition:none}.hole.tgt .cup{animation:none}}
</style>
</head>
<body>
<div class="top" id="top" hidden>
 <div class="top-in"><span class="who" id="who"></span><span class="chip" id="modeChip"></span><span class="score" id="scoreTxt"></span><span class="timer" id="timer"></span></div>
</div>
<div class="wrap">
 <!-- 입장 -->
 <section id="s-join" hidden>
  <div style="margin:30px 0 18px"><h1><span>Peg Solitaire</span><br>놀이터</h1></div>
  <div class="card">
   <label for="nameIn" style="font-weight:700">내 별명</label>
   <input id="nameIn" class="name" maxlength="12" placeholder="예: 별빛토끼" autocomplete="off">
   <button class="btn pri" id="joinBtn" style="width:100%;font-size:19px">입장하기</button>
   <div class="err" id="joinErr"></div>
  </div>
 </section>
 <!-- 대기 -->
 <section id="s-wait" hidden>
  <div class="card" style="margin-top:14px">
   <div class="big" id="waitTitle">선생님이 게임을 시작하면 열려요</div>
   <p class="note" id="waitSub">화면을 켜 둔 채로 기다려요.</p>
   <div id="lastRes" hidden>
    <div class="res"><div><b id="rScore">0</b><span>점수</span></div><div><b id="rSolved">0</b><span>성공한 문제</span></div><div><b id="rRank">-</b><span>순위</span></div></div>
   </div>
  </div>
  <div class="howto"><div><b>👆</b>말을 톡<br>= 뛰어넘기</div><div><b>↶</b>무르기로<br>한 수 되돌리기</div><div><b><i style="font-family:'Times New Roman',serif">xyz</i></b>자리값<br>보기</div></div>
  <div class="hist" id="hist" hidden></div>
 </section>
 <!-- 게임 -->
 <section id="s-game" hidden>
  <div class="plist" id="plist" hidden></div>
  <div class="nums" id="nums" hidden></div>
  <div id="mapHead" hidden>
   <div class="ptitle2">마지막 말 지도 · 15칸</div>
   <p class="lead">처음 비울 칸을 고르고 말 1개로 끝내요.<br>마지막 말이 어디에 남았는지 우리 반 지도에 모여요!</p>
  </div>
  <div class="ptitle2" id="pTitle"></div>
  <div class="msg" id="msg"></div>
  <div class="stage"><div class="pb" id="board"></div></div>
  <div class="info" id="info"></div>
  <div class="ctrl" id="ctrl"></div>
  <div id="mapBox" hidden>
   <div class="stat2"><div><b id="mMine">0</b><span>내가 찾은 결과</span></div><div><b id="mClass">0</b><span>우리 반이 찾은 서로 다른 결과</span></div></div>
   <div class="sec">내가 찾은 결과 <span class="note" style="font-size:12px">● 처음 비운 칸 · ● 마지막 말</span></div>
   <div class="gal" id="mGal"></div>
  </div>
  <p class="note" id="gnote"></p>
 </section>
</div>
<div class="ov" id="pauseOv" hidden><div class="card"><div class="big">잠깐 멈춤 ✋</div><p class="note">선생님 설명을 들어요. 남은 시간은 그대로예요.</p></div></div>
<div class="net" id="net" hidden>연결을 다시 시도하는 중…</div>

<script src="config.js"></script>
<script>
/* ═════════ 서버 호출 ═════════ */
/* 화면을 밖(Vercel 등)에 올린 경우: config.js의 API_URL로 앱스스크립트와 데이터만 주고받는다 */
function apiReady(){return typeof window.API_URL==='string'&&/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(window.API_URL)}
function call(fn){const args=[].slice.call(arguments,1);
 if(window.API_URL!==undefined){
  if(!apiReady())return Promise.reject(new Error('config.js에 앱스스크립트 웹 앱 주소(…/exec)를 넣어 주세요.'));
  const ctl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>{if(ctl)ctl.abort()},20000);
  return fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',signal:ctl?ctl.signal:undefined})
   .then(r=>{if(!r.ok)throw new Error('서버 응답 오류 ('+r.status+')');return r.json()})
   .then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'알 수 없는 오류');return j.data})
   .catch(e=>{if(e&&e.name==='AbortError')throw new Error('서버 응답이 늦어요');throw e})
   .finally(()=>clearTimeout(tm))}
 return new Promise((res,rej)=>{
 if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn].apply(null,args)}
 else if(window.__gs){window.__gs(fn,args).then(r=>{if(r&&r.__err)rej(new Error(r.__err));else res(r)},rej)}
 else rej(new Error('서버에 연결할 수 없어요'))})}
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function errText(e){return String((e&&e.message)||e).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ═════════ 앱 상태 ═════════ */
const A={name:null,token:null,bank:null,offset:0,state:{status:'idle'},me:null,round:null,game:null,mode:null,opts:{showSol:false},
 busy:false,pollT:null,activity:'대기',doneP:{},map:[],cls:0,real:{cur:0,saved:{},seen:{}}};

/* ═════════ 입장 ═════════ */
async function boot(){
 const saved=store('peg_me');
 try{A.bank=await call('api_bank')}catch(e){$('s-join').hidden=false;$('joinErr').textContent='서버에 연결하지 못했어요: '+errText(e)+' (새로 고쳐 보세요)';return}
 if(saved&&saved.name){try{const r=await call('api_join',saved.name,saved.token);return entered(r)}catch(e){}}
 show('join');
}
async function join(){
 const n=$('nameIn').value.trim();if(!n){$('joinErr').textContent='별명을 써 주세요.';return}
 $('joinBtn').disabled=true;$('joinErr').textContent='';
 try{const saved=store('peg_me');const r=await call('api_join',n,saved&&saved.name===n?saved.token:'');entered(r)}
 catch(e){$('joinErr').textContent=errText(e)}finally{$('joinBtn').disabled=false}
}
function entered(r){A.name=r.name;A.token=r.token;store('peg_me',r);$('who').textContent=r.name;$('top').hidden=false;show('wait');loadHistory();poll();}
$('joinBtn').onclick=join;$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
function show(w){['join','wait','game'].forEach(x=>$('s-'+x).hidden=x!==w)}

/* ═════════ 상태 확인 (몇 초마다) ═════════ */
async function poll(){
 clearTimeout(A.pollT);
 try{const t0=Date.now();const r=await call('api_poll',A.name,A.token,A.activity);A.offset=r.now-(t0+Date.now())/2;$('net').hidden=true;await apply(r)}
 catch(e){const m=errText(e);if(/다시 입장/.test(m)){store('peg_me',{});location.reload();return}$('net').hidden=false}
 A.pollT=setTimeout(poll,3500+Math.random()*1000);
}
async function apply(r){
 const s=r.state;A.state=s;
 if(r.opts){const ch=A.opts.showSol!==r.opts.showSol;A.opts=r.opts;if(ch&&A.game==='play'&&G)drawCtrl()}
 if(r.me&&!A.busy){A.me=r.me;if(A.game==='real'&&A.real.shownReach!==reachN())drawNums()}
 if(r.cls){A.cls=r.cls.pairs;$('mClass').textContent=A.cls}
 $('pauseOv').hidden=s.status!=='paused';
 const live=s.status==='running'||s.status==='paused';
 if(live&&s.roundId!==A.round)await startRound(s);
 else if(!live&&A.round&&s.roundId===A.round&&s.status==='ended')endRound(r);
 else if(!live&&!A.round)waitScreen(r);
 updTop();
}
function waitScreen(r){
 show('wait');A.activity='대기';const s=r.state;
 if(s.status==='ended'&&s.mode==='real'&&r.me){$('lastRes').hidden=false;$('waitTitle').textContent='지난 게임 결과';$('rScore').textContent=r.me.score;$('rSolved').textContent=r.me.solved;$('rRank').textContent=r.rank?r.rank+'등':'-';$('waitSub').textContent='다음 활동을 기다려요.'}
 else if(s.status==='ended'&&s.roundId){$('lastRes').hidden=true;$('waitTitle').textContent='활동 끝!';$('waitSub').textContent='수고했어요. 다음 활동을 기다려요.'}
 else{$('lastRes').hidden=true;$('waitTitle').textContent='선생님이 게임을 시작하면 열려요';$('waitSub').textContent='화면을 켜 둔 채로 기다려요.'}
}
function endRound(r){
 A.round=null;stopDemo();A.activity='게임 끝';show('wait');waitScreen(r);setTimeout(loadHistory,600);
 $('waitTitle').textContent=r.state.mode==='real'?'게임 끝! 🎉':'활동 끝!';
 if(r.state.mode!=='real'){$('lastRes').hidden=true;$('waitSub').textContent='수고했어요. 다음 활동을 기다려요.'}
}
function updTop(){
 const s=A.state;const live=s.status==='running'||s.status==='paused';
 $('modeChip').hidden=!live;$('scoreTxt').hidden=!(live&&s.mode==='real');$('timer').hidden=!live;
 if(live){$('modeChip').textContent=(s.mode==='real'?'실전':'연습');$('modeChip').className='chip '+(s.mode==='real'?'real':'prac');$('scoreTxt').textContent=(A.me?A.me.score:0)+'점'}
}
setInterval(()=>{const s=A.state;if(s.status!=='running'&&s.status!=='paused')return;
 const left=s.status==='paused'?s.remainMs:s.endAt-(Date.now()+A.offset);
 const sec=Math.max(0,Math.ceil(left/1000));$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 $('timer').classList.toggle('low',sec<=30);
 if(sec===0&&s.status==='running'&&!A.zeroed){A.zeroed=true;setTimeout(poll,800)}},250);
const canPlay=()=>A.state.status==='running';

/* ═════════ 라운드 시작 ═════════ */
async function startRound(s){
 A.round=s.roundId;A.mode=s.mode;A.game=s.game;A.zeroed=false;A.doneP={};A.map=[];A.real={cur:0,saved:{},seen:{}};
 if(s.game==='map'){try{const ms=await call('api_mystate',A.name,A.token);if(ms&&ms.map)A.map=ms.map}catch(e){}}
 show('game');
 $('plist').hidden=s.game!=='play';$('nums').hidden=s.game!=='real';$('mapHead').hidden=s.game!=='map';$('mapBox').hidden=s.game!=='map';
 if(s.game==='play')openPlay(0);else if(s.game==='map')openMap();else openReal(firstOpen());
}

/* ═════════ 대기 화면: 내 기록 ═════════ */
async function loadHistory(){
 let h;try{h=await call('api_myhistory',A.name,A.token)}catch(e){return}
 const box=$('hist');if(!h||!h.length){box.hidden=true;return}
 const tm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
 box.innerHTML='<h3>내 기록</h3>'+h.map(x=>{let b='';
  if(x.play)b+=`<div class="hl">🟣 말 1개로 끝낸 판 <em>${x.play.length}가지</em></div><div class="chips">${x.play.map(t=>`<span>${t}</span>`).join('')}</div>`;
  if(x.map)b+=`<div class="hl">🗺️ 찾은 결과 <em>${x.map.n}가지</em>${x.map.first?` · 반에서 처음 찾은 결과 <em>${x.map.first}가지</em>`:''}</div><div class="chips">${x.map.pairs.map(p=>`<span>${p[0]}번 비움 → ${p[1]}번</span>`).join('')}</div>`;
  if(x.real)b+=`<div class="hl">🏁 점수 <em>${x.real.score}점</em> · 성공 ${x.real.solved}/${x.real.total}${x.real.hints?` · 힌트 ${x.real.hints}번`:''}</div>`;
  return `<div class="hc"><div class="ht"><b>${x.label}</b><span>${tm(x.at)}</span></div>${b}</div>`}).join('');
 box.hidden=false;
}

/* ═════════ 판 엔진 ═════════
   G.pegs: 칸마다 0/1 · G.hist: 지금까지 둔 수 [출발, 넘은 칸, 도착] · 탭: 말을 누르면 갈 곳이 하나일 때 바로 뛰어넘음 */
let G=null;
function setMsg(t,c){$('msg').textContent=t||'';$('msg').className='msg'+(c?' '+c:'')}
function newGame(bid,start,opt){
 stopDemo();const B=A.bank.boards[bid],n=B.cells.length;
 G={bid,B,n,start:start?start.slice():null,pegs:new Array(n).fill(0),hist:[],sel:null,choosing:!start,lab:G?G.lab:0,opt,anim:false,ended:false,hintCell:null};
 if(G.lab>B.lab.length)G.lab=0;
 if(start)start.forEach(i=>G.pegs[i]=1);else G.pegs.fill(1);
 if(opt.restore)opt.restore.forEach(m=>applyMove(m));
 render();status(true);
}
const pegCount=()=>G.pegs.reduce((a,b)=>a+b,0);
const legal=()=>G.B.moves.filter(([a,b,t])=>G.pegs[a]&&G.pegs[b]&&!G.pegs[t]);
const legalFrom=i=>legal().filter(m=>m[0]===i);
function applyMove(m){G.pegs[m[0]]=0;G.pegs[m[1]]=0;G.pegs[m[2]]=1;G.hist.push(m)}
function unMove(){const m=G.hist.pop();if(!m)return;G.pegs[m[0]]=1;G.pegs[m[1]]=1;G.pegs[m[2]]=0}
function emptyHole(){if(!G.start)return -1;for(let i=0;i<G.n;i++)if(G.start.indexOf(i)<0)return i;return -1}
const cellNo=i=>G.B.kind==='tri'?(i+1)+'번':'';

/* 판 그리기 */
function geom(){
 const B=G.B,W=Math.min(window.innerWidth-28,520),Hm=Math.max(260,window.innerHeight*0.52);
 if(B.kind==='tri'){const n=B.n;const d=Math.floor(Math.min(W/(n+1.2),Hm/((n-1)*0.88+2),84)),px=d*0.6,pt=d*0.62;
  return{d,w:Math.round(n*d+2*px),h:Math.round(((n-1)*0.88+1)*d+pt+d*0.45),pos:B.cells.map(([r,c])=>[px+(c-r/2+(n-1)/2)*d+d/2,pt+r*d*0.88+d/2])}}
 const pad=6,d=Math.floor(Math.min((W-2*pad)/B.C,(Hm-2*pad)/B.R,64));
 return{d,w:B.C*d+2*pad,h:B.R*d+2*pad,pos:B.cells.map(([r,c])=>[pad+c*d+d/2,pad+r*d+d/2])};
}
function render(){
 if(!G)return;const g=geom(),b=$('board'),B=G.B;G.g=g;
 b.className='pb '+(B.kind==='tri'?'tri':'sq')+(G.choosing?' choosing':'');b.style.width=g.w+'px';b.style.height=g.h+'px';
 const tg=new Set(G.sel!==null?legalFrom(G.sel).map(m=>m[2]):[]);const last=G.hist.length?G.hist[G.hist.length-1][2]:-1;
 const lab=G.lab?B.lab[G.lab-1]:null;
 let h='';
 if(B.kind==='tri'){const p=g.pos,n=B.n,top=p[0],bl=p[B.cells.findIndex(([r,c])=>r===n-1&&c===0)],br=p[B.cells.length-1],e=g.d*0.62;
  h+=`<svg class="tri-bg" width="${g.w}" height="${g.h}"><polygon points="${top[0]},${top[1]-e} ${bl[0]-e*0.95},${bl[1]+e*0.55} ${br[0]+e*0.95},${br[1]+e*0.55}" fill="#efe8dc" stroke="#262222" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
 B.cells.forEach((_,i)=>{const[x,y]=g.pos[i],has=G.pegs[i];
  const cls='hole'+(has?' has':'')+(G.sel===i?' sel':'')+(tg.has(i)?' tgt':'')+(i===last&&!G.choosing?' last':'')+(G.hintCell===i?' hint':'');
  h+=`<button class="${cls}" data-i="${i}" style="left:${x-g.d/2}px;top:${y-g.d/2}px;width:${g.d}px;height:${g.d}px" aria-label="${cellNo(i)||'칸'} ${has?'말 있음':'빈칸'}"><span class="cup"></span>${has?'<span class="peg"></span>':''}${B.kind==='tri'?`<span class="no">${i+1}</span>`:''}${lab?`<span class="lab" style="font-size:${Math.round(g.d*0.36)}px">${lab[i]}</span>`:''}</button>`});
 b.innerHTML=h;
 b.querySelectorAll('.hole').forEach(x=>x.onclick=()=>tap(+x.dataset.i));
 drawInfo();
}
function drawInfo(){
 if(!G)return;let h='';
 if(!G.choosing)h+=`<span>남은 말 ${pegCount()}개</span><span>${G.hist.length}수</span>`;
 if(G.lab){const L=G.B.lab[G.lab-1];const c={x:0,y:0,z:0};let v=0;const val={x:1,y:2,z:3};
  G.pegs.forEach((p,i)=>{if(p){c[L[i]]++;v^=val[L[i]]}});
  h+=`<span class="sum">${c.x}x + ${c.y}y + ${c.z}z = ${v?'xyz'[v-1]:'0'}</span>`}
 $('info').innerHTML=h;
}
/* 탭 */
function tap(i){
 if(!G||G.anim||G.demo||A.busy)return;
 if(!canPlay()){setMsg('지금은 움직일 수 없어요.','bad');return}
 if(G.opt.kind==='real'&&isDone(G.opt.idx)){setMsg('✓ 이미 푼 문제예요. 다른 번호를 골라요.','ok');return}
 if(G.choosing){G.pegs[i]=0;G.start=[];G.pegs.forEach((p,k)=>{if(p)G.start.push(k)});G.choosing=false;
  setMsg((G.B.kind==='tri'?(i+1)+'번 칸을 비웠어요. ':'')+'말을 톡 누르면 뛰어넘어요.');render();status();onChoose();return}
 G.hintCell=null;
 if(G.pegs[i]){
  const ms=legalFrom(i);
  if(!ms.length){G.sel=null;render();setMsg('이 말은 지금 뛰어넘을 수 없어요.','bad');return}
  if(ms.length===1){G.sel=null;move(ms[0]);return}
  G.sel=G.sel===i?null:i;render();setMsg(G.sel===null?'':'갈 곳이 여러 곳이에요. 초록 칸을 골라요.');return}
 if(G.sel!==null){const m=legalFrom(G.sel).find(q=>q[2]===i);if(m){G.sel=null;move(m);return}}
 // 빈칸을 눌렀을 때: 이 칸으로 올 수 있는 말이 하나뿐이면 바로 이동
 const into=legal().filter(q=>q[2]===i);
 if(into.length===1){G.sel=null;move(into[0]);return}
 if(into.length>1){setMsg('이 칸으로 올 수 있는 말이 여러 개예요. 움직일 말을 먼저 눌러요.');return}
 G.sel=null;render();
}
async function move(m,fast){
 G.anim=true;const b=$('board'),g=G.g;
 const ea=b.querySelector(`.hole[data-i="${m[0]}"] .peg`),eb=b.querySelector(`.hole[data-i="${m[1]}"] .peg`);
 if(ea&&g){const dx=g.pos[m[2]][0]-g.pos[m[0]][0],dy=g.pos[m[2]][1]-g.pos[m[0]][1];ea.style.zIndex=3;ea.parentNode.style.zIndex=3;ea.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
 if(eb)eb.classList.add('gone');
 await sleep(fast?120:190);
 applyMove(m);G.anim=false;render();status();
}
function undo(){if(!G||G.anim||G.demo||!G.hist.length)return;unMove();G.sel=null;G.hintCell=null;G.ended=false;render();setMsg('한 수 되돌렸어요.');status(true)}
function resetBoard(){if(!G||G.anim||G.demo)return;if(G.choosing)return;while(G.hist.length)unMove();G.sel=null;G.hintCell=null;G.ended=false;render();setMsg('처음 상태예요.');status(true)}
function rechoose(){if(!G||G.anim||G.demo)return;G.pegs.fill(1);G.hist=[];G.start=null;G.choosing=true;G.sel=null;G.ended=false;render();setMsg('처음 비울 칸을 하나 톡 눌러요.')}
function labText(){const n=G.B.lab.length;return !G.lab?'x·y·z 보기':(G.lab<n?'x·y·z 방향 바꾸기':'x·y·z 끄기')}
function cycleLab(){if(!G)return;G.lab=(G.lab+1)%(G.B.lab.length+1);render();drawCtrl()}
function status(quiet){
 if(!G||G.choosing)return;const n=pegCount();
 if(n===1&&G.hist.length){if(!G.ended&&!quiet){G.ended=true;onWin(G.pegs.indexOf(1))}return}
 if(!legal().length&&G.hist.length){setMsg('더 움직일 수 없어요 · 남은 말 '+n+'개. ↶ 무르기나 처음부터를 눌러 봐요.','bad')}
}
function onWin(f){if(G.demo)return;const k=G.opt.kind;if(k==='play')winPlay(f);else if(k==='map')winMap(f);else if(k==='real')winReal(f)}
function onChoose(){if(G.opt.kind==='play')A.activity='체험: '+A.bank.play[G.opt.idx].title+' ('+(emptyHole()+1)+'번 비움)';else if(G.opt.kind==='map')A.activity='지도: '+(emptyHole()+1)+'번 비움'}
const movesOut=()=>G.hist.map(m=>[m[0],m[2]]);

/* 아래 버튼 */
function drawCtrl(){
 const k=G.opt.kind,c=$('ctrl'),L=labText();
 let h=`<button class="btn" id="bUndo">↶ 무르기</button><button class="btn" id="bReset">처음부터</button>`;
 if(k==='real'){const u=hintsUsed(G.opt.idx),left=2-u;
  h+=`<button class="btn${G.lab?' on':''}" id="bLab">${L}</button>`+
   `<button class="btn" id="bHint"${left<=0||isDone(G.opt.idx)?' disabled':''}>힌트 ${left}번<span class="hintc">1번에 −3점</span></button>`+
   `<button class="btn pri wide" id="bNext">${G.opt.idx===reachN()&&G.opt.idx<realList().length-1&&!isDone(G.opt.idx)?'넘어가기 → (다음 번호 열기)':'다음 문제 →'}</button>`}
 else{const ch=k==='map'||A.bank.play[G.opt.idx].choose;
  h+=(ch?`<button class="btn" id="bChoose">빈칸 바꾸기</button>`:'')+`<button class="btn${G.lab?' on':''}" id="bLab"${ch?'':' style="grid-column:span 2"'}>${L}</button>`;
  if(k==='play')h+=`<button class="btn wide${A.opts.showSol||G.demo?'':' locked'}" id="bSol">${G.demo?'■ 풀이 멈추기':(A.opts.showSol?'▶ 풀이 보기':'🔒 풀이 보기 (선생님이 열어 줘야 해요)')}</button>`}
 c.innerHTML=h;
 $('bUndo').onclick=undo;$('bReset').onclick=resetBoard;$('bLab').onclick=cycleLab;
 if($('bChoose'))$('bChoose').onclick=rechoose;
 if($('bHint'))$('bHint').onclick=realHint;
 if($('bNext'))$('bNext').onclick=()=>goNext(G.opt.idx);
 if($('bSol'))$('bSol').onclick=showSolution;
}
addEventListener('resize',()=>{if(G&&!G.anim)render()});

/* ═════════ 체험 ═════════ */
function openPlay(i){
 const list=A.bank.play,p=list[i],pl=$('plist');
 pl.innerHTML=list.map((q,k)=>`<button class="btn${k===i?' on':''}${A.doneP[q.id]?' done':''}" data-k="${k}">${q.title}</button>`).join('');
 pl.querySelectorAll('.btn').forEach(b=>b.onclick=()=>openPlay(+b.dataset.k));
 const on=pl.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 $('pTitle').textContent=p.title+(p.board==='eng'&&p.pegs?' · 말 '+p.pegs.length+'개':'');A.activity='체험: '+p.title;
 newGame(p.board,p.pegs||null,{kind:'play',idx:i});
 setMsg(p.pegs?'말을 톡 누르면 뛰어넘어요. 말 1개만 남겨 봐요!':'처음 비울 칸을 하나 톡 눌러요.');
 drawCtrl();
 $('gnote').textContent='말을 누르면 갈 곳이 하나일 때 바로 뛰어넘고, 여러 곳이면 초록 칸이 보여요. 빈칸을 눌러도 돼요.';
}
async function winPlay(f){
 const p=A.bank.play[G.opt.idx];setMsg('🎉 성공! 말 1개'+(G.B.kind==='tri'?' · 마지막 말은 '+(f+1)+'번 칸':'')+'. 다른 판에도 도전해 봐요.','ok');toast('성공!',G.hist.length+'수 만에 말 1개');
 A.doneP[p.id]=1;const b=document.querySelector('#plist .btn.on');if(b)b.classList.add('done');
 try{await call('api_play',A.name,A.token,{roundId:A.round,id:p.id,start:G.start,moves:movesOut()})}catch(e){}
}
function stopDemo(){if(G&&G.demo){G.demo=false;if(G.demoT)clearTimeout(G.demoT)}}
async function showSolution(){
 if(!G)return;if(G.demo){stopDemo();setMsg('풀이를 멈췄어요. 여기서부터 이어서 해 봐요.');drawCtrl();return}
 if(!A.opts.showSol){setMsg('선생님이 풀이 보기를 열어 주면 볼 수 있어요.','bad');return}
 if(G.choosing){setMsg('먼저 비울 칸을 골라요. 그 칸에서 시작하는 풀이를 보여 줄게요.','bad');return}
 let r;try{r=await call('api_solution',A.name,A.token,{roundId:A.round,id:A.bank.play[G.opt.idx].id,start:G.start})}catch(e){setMsg(errText(e),'bad');return}
 while(G.hist.length)unMove();G.sel=null;G.ended=false;render();G.demo=true;drawCtrl();
 setMsg(r.left>1?'이 빈칸에서는 말 1개로 끝낼 수 없어요. 가장 적게 남기는 풀이를 보여 줄게요.':'풀이를 한 수씩 보여 줄게요.');
 const mv=r.moves.map(k=>G.B.moves[k]);let k=0;
 const step=async()=>{if(!G||!G.demo)return;if(k>=mv.length){G.demo=false;G.ended=true;drawCtrl();setMsg('풀이 끝 · 남은 말 '+pegCount()+'개. 처음부터 직접 해 봐요!','ok');return}
  await move(mv[k++]);if(G.demo)G.demoT=setTimeout(step,560)};
 G.demoT=setTimeout(step,500);
}

/* ═════════ 마지막 말 지도 ═════════ */
function openMap(){
 $('pTitle').textContent='';A.activity='지도 (찾은 결과 '+A.map.length+')';
 newGame(A.bank.map.board,null,{kind:'map'});setMsg('처음 비울 칸을 하나 톡 눌러요.');drawCtrl();drawMapGal();
 $('gnote').textContent='같은 칸을 비워도 마지막 말이 다른 곳에 남을 수 있어요. 여러 가지를 찾아봐요!';
}
function triSvg(e,fs,s){const B=A.bank.boards[A.bank.map.board],n=B.n,d=s;const w=n*d,h=((n-1)*0.88+1)*d;
 let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
 B.cells.forEach(([r,c],i)=>{const x=(c-r/2+(n-1)/2)*d+d/2,y=r*d*0.88+d/2;const isE=i===e,isF=fs.indexOf(i)>=0;
  o+=`<circle cx="${x}" cy="${y}" r="${d*0.36}" fill="${isF?'#7c4ddb':isE?'#fff':'#e4ddd1'}" stroke="${isE?'#d6336c':isF?'#4b21a8':'#cfc6b8'}" stroke-width="${isE?2.5:1}"/>`});
 return o+'</svg>'}
function drawMapGal(){
 $('mMine').textContent=A.map.length;$('mClass').textContent=A.cls||0;
 const by={};A.map.forEach(p=>{(by[p.e]=by[p.e]||[]).push(p.f)});
 const ks=Object.keys(by).map(Number).sort((a,b)=>a-b);
 $('mGal').innerHTML=ks.length?ks.map(e=>`<div class="it">${triSvg(e,by[e],15)}<span>${e+1}번 비움 → ${by[e].map(f=>f+1).sort((a,b)=>a-b).join(', ')}번</span></div>`).join(''):'<span class="note">말 1개로 끝내면 여기에 모여요.</span>';
}
async function winMap(f){
 const e=emptyHole();A.busy=true;setMsg('지도에 올리는 중…');
 try{const r=await call('api_map',A.name,A.token,{roundId:A.round,empty:e,moves:movesOut()});
  if(r.dup){setMsg('성공! '+(e+1)+'번 비움 → '+(f+1)+'번. 이미 찾은 결과예요. 다른 칸에 남겨 볼까요?','ok');toast('성공!','이미 찾은 결과')}
  else{A.map.push({e,f});setMsg('🎉 '+(e+1)+'번 비움 → '+(f+1)+'번! 지도에 올렸어요.','ok');toast(r.firstInClass?'반에서 처음!':'지도에 올렸어요!',(e+1)+'번 비움 → '+(f+1)+'번');drawMapGal();poll()}
  A.activity='지도 (찾은 결과 '+A.map.length+')';
 }catch(err){setMsg(errText(err),'bad');G.ended=false}finally{A.busy=false}
}

/* ═════════ 실전 ═════════ */
const realList=()=>A.bank.real;
const isDone=i=>!!(A.me&&A.me.done&&A.me.done[i]);
const hintsUsed=i=>(A.me&&A.me.hintBy&&A.me.hintBy[i])||0;
const reachN=()=>(A.me&&A.me.reach)||0;
function firstOpen(){const R=reachN();for(let i=0;i<=R;i++)if(!isDone(i))return i;return R}
function nextOpen(from){const R=reachN();for(let j=from+1;j<=R;j++)if(!isDone(j))return j;for(let j=0;j<from;j++)if(!isDone(j))return j;return -1}
function drawNums(){const L=realList(),cur=A.real.cur;const R=reachN();A.real.shownReach=R;
 $('nums').innerHTML=L.map((p,i)=>i>R?`<button class="num lock" disabled aria-label="${i+1}번 잠김">🔒${i+1}</button>`:`<button class="num${isDone(i)?' done':A.real.seen[i]?' seen':''}${i===cur?' cur':''}" data-i="${i}">${i+1}</button>`).join('');
 $('nums').querySelectorAll('.num[data-i]').forEach(b=>b.onclick=()=>{if(!A.busy&&!(G&&G.anim))openReal(+b.dataset.i)});
 const on=$('nums').querySelector('.cur');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 if(G&&G.opt.kind==='real')drawCtrl()}
function saveReal(){if(G&&G.opt.kind==='real')A.real.saved[G.opt.idx]=G.hist.slice()}
function openReal(i){
 if(i>reachN())i=reachN();
 saveReal();const L=realList(),q=L[i];A.real.cur=i;A.real.seen[i]=1;
 const solvedN=L.filter((_,k)=>isDone(k)).length;
 $('pTitle').textContent=(i+1)+'번 · '+q.title;A.activity='실전 '+(i+1)+'번 (성공 '+solvedN+'/'+L.length+')';
 newGame(q.board,q.pegs,{kind:'real',idx:i,restore:isDone(i)?null:A.real.saved[i]});drawNums();
 setMsg('말 1개만 남겨요. 어느 칸에 남아도 돼요!');
 if(isDone(i)){G.ended=true;setMsg('✓ 이미 푼 문제예요. 다른 번호를 골라요.','ok')}
 if(solvedN===L.length)setMsg('🎉 모든 문제를 다 풀었어요! 결과를 기다려요.','ok');
 $('gnote').textContent='위 번호를 눌러 다른 문제로 갔다 와도 둔 수는 그대로예요.';
}
async function goNext(i){
 if(A.busy||(G&&G.anim))return;const R=reachN(),L=realList();
 if(i===R&&R<L.length-1&&!isDone(i)){
  A.busy=true;$('bNext').disabled=true;
  try{const r=await call('api_skip',A.name,A.token,{roundId:A.round,puzzle:i});A.me=r.me;A.busy=false;openReal(reachN())}
  catch(e){A.busy=false;$('bNext').disabled=false;setMsg(errText(e),'bad')}
  return}
 const j=nextOpen(i);
 if(j>=0)openReal(j);else if(i!==R)openReal(R);else setMsg('열린 문제를 모두 풀었어요!','ok');
}
async function winReal(){
 A.busy=true;setMsg('확인하는 중…');const i=G.opt.idx;
 try{const r=await call('api_submit',A.name,A.token,{roundId:A.round,puzzle:i,moves:movesOut()});
  A.me=r.me;saveReal();updTop();toast('+'+r.points+'점',r.hints?('힌트 '+r.hints+'번 사용'):'말 1개 성공!');drawNums();
  setTimeout(()=>{A.busy=false;const j=nextOpen(i);openReal(j>=0?j:i)},1200);
 }catch(e){A.busy=false;G.ended=false;setMsg(errText(e),'bad')}
}
async function realHint(){
 if(!G||G.ended||A.busy||G.anim)return;A.busy=true;$('bHint').disabled=true;const i=G.opt.idx;
 try{const r=await call('api_hint',A.name,A.token,{roundId:A.round,puzzle:i,moves:movesOut()});
  A.me.hintBy=A.me.hintBy||{};A.me.hintBy[i]=r.used;A.busy=false;
  for(let k=0;k<r.undo;k++){unMove()}G.sel=null;G.ended=false;render();if(r.undo)await sleep(350);
  await move(r.move);G.hintCell=r.move[2];render();
  setMsg((r.undo?'힌트: 이대로는 1개로 끝낼 수 없어서 '+r.undo+'수 되돌리고, ':'힌트: ')+'노란 테두리 말을 움직였어요. (이 문제 −'+(3*r.used)+'점)');
  drawCtrl();status();
 }catch(e){A.busy=false;setMsg(errText(e),'bad');drawCtrl()}
}
function toast(t,s){const d=document.createElement('div');d.className='toast';d.innerHTML=t+(s?'<small>'+s+'</small>':'');document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}

boot();
</script>
